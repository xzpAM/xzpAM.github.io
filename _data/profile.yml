  <p>
     Hi, I'm Zhipeng Xie (解志鹏), an M.S.-Ph.D. student at East China Normal University,
     advised by Prof. Jing Zhao. My research interests include Robotics, Embodied AI,
     Multimodal Large Language Models, and World Models. I am particularly interested in
     building intelligent agents and robotic systems that can perceive, reason, and act in
     complex real-world environments. Welcome to my homepage, and feel free to reach out
     for communication and collaboration!
